<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiroTacos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">🌮 KiroTacos</a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul>
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="menu.html">Menú</a></li>
      <li><a href="contact.html">Contacto</a></li>
    </ul>
    <div class="nav-search">
      <input type="search" id="search-input" placeholder="Buscar producto...">
    </div>
  </nav>

  <main>

    <!-- Hero -->
    <section class="hero">
      <div class="hero-content">
        <h1>Los mejores tacos de Guatemala</h1>
        <p>Sabor auténtico, ingredientes frescos, directo a tu mesa.</p>
        <a href="menu.html" class="btn-primary">Ver menú</a>
      </div>
    </section>

    <!-- Carrusel -->
    <section class="carousel-section">
      <div class="carousel" aria-label="Galería de tacos">
        <div class="carousel-track">
          <img src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=1200&q=80" alt="Tacos al pastor">
          <img src="https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=1200&q=80" alt="Tacos de carne">
          <img src="https://images.unsplash.com/photo-1624300629298-e9de39c13be5?w=1200&q=80" alt="Tacos variados">
        </div>
        <button class="carousel-btn prev" aria-label="Anterior">&#8249;</button>
        <button class="carousel-btn next" aria-label="Siguiente">&#8250;</button>
        <div class="carousel-dots"></div>
      </div>
    </section>

    <!-- Productos destacados -->
    <section class="featured">
      <h2>Destacados</h2>
      <div class="featured-grid" id="featured-grid">
        <!-- generado por JS -->
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 KiroTacos · Guatemala</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/carousel.js"></script>
  <script src="js/search.js"></script>
  <script>
    const toggle = document.querySelector('.nav-toggle');
    const navList = document.querySelector('nav ul');
    toggle.addEventListener('click', () => {
      const open = navList.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });

    renderCards(products.filter(p => p.destacado), 'featured-grid');
  </script>
</body>
</html>
